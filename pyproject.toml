[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforge"
version = "0.1.0"
description = "AI-powered operations investigation over a synthetic operations environment, via the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nick Reid" }]
keywords = ["mcp", "model-context-protocol", "incident-investigation", "sre", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Monitoring",
]
# Direct runtime dependencies only. `pydantic` is declared explicitly because
# SignalForge imports it directly; it is not relied on as a transitive dependency of `mcp`.
# Exact versions verified in Phase 1: mcp 2.2.0, mcp-types 2.2.0, pydantic 2.13.5 (see constraints.txt).
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.12,<3",
  # Validates provider-requested tool arguments against the MCP input schemas before a call leaves the
  # orchestrator. Already a transitive dependency of `mcp`; declared because SignalForge imports it directly.
  "jsonschema>=4,<5",
  # The local HTTP API imports these directly, so they are declared rather than relied on as
  # transitive dependencies of `mcp`. Versions verified in Phase 4: starlette 1.6.0, uvicorn 0.52.4,
  # sse-starlette 3.4.11, httpx2 2.12.0.
  "starlette>=0.47,<2",
  "uvicorn>=0.30,<1",
  "sse-starlette>=3,<4",
  "httpx2>=2,<3",
]

[project.optional-dependencies]
# Live model providers are optional. The base install runs scripted investigations, replay, MCP,
# retrieval, evaluation and traces with no vendor SDK and no credentials.
anthropic = ["anthropic>=1,<2"]
openai = ["openai>=3,<4"]
providers = ["anthropic>=1,<2", "openai>=3,<4"]
dev = [
  "pytest>=8",
  "anyio>=4.9",
  "jsonschema>=4",
  "ruff>=0.6",
]

[project.scripts]
signalforge = "signalforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"signalforge.world.corpus.runbooks" = ["*.md"]
"signalforge.world.corpus.incidents" = ["*.md"]
"signalforge.api.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
  "stdio: spawns the MCP server as a stdio subprocess",
  "http: runs the MCP server over Streamable HTTP on a local port",
]
filterwarnings = ["error::DeprecationWarning:signalforge.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
